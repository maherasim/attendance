// ── HAVERSINE DISTANCE (metres) ───────────────────────────────────────────────
function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

async function compressPhoto(dataUrl) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const MAX=400; let w=img.width, h=img.height;
      if(w>MAX||h>MAX){ if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      resolve(c.toDataURL("image/jpeg",0.5));
    };
    img.src = dataUrl;
  });
}

// POST a record to Google Apps Script
// Google Apps Script requires the body as text/plain to avoid CORS preflight
async function postToSheet(url, rec) {
  // Strip photo from payload if too large — photo already saved locally
  const payload = { ...rec };
  try {
    // text/plain body = no CORS preflight = Google Apps Script accepts it
    const resp = await fetch(url, {
      method: "POST",
      body: JSON.stringify(payload),
    });
    const text = await resp.text();
    try { 
      const data = JSON.parse(text); 
      if (data && data.success === false) throw new Error(data.error || "Script returned error.");
      return data;
    }
    catch(parseErr) { 
      if (text.toLowerCase().includes("<html")) {
        throw new Error("Google Apps Script error: ensure deployment is set to 'Anyone' and returns JSON.");
      }
      return { success: true }; 
    }
  } catch(e) {
    throw new Error("POST failed: " + e.message);
  }
}

// GET all records via JSONP — bypasses CORS without any proxy
// Works because <script> tags are never blocked by CORS rules
function fetchFromSheet(url) {
  return new Promise((resolve, reject) => {
    const cbName = "gasCallback_" + Date.now();
    const script  = document.createElement("script");

    // Timeout after 15 seconds
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Request timed out — check your internet connection"));
    }, 15000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cbName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data) {
      cleanup();
      if (data && data.success === false) reject(new Error(data.error || "Script error"));
      else resolve((data && data.records) || []);
    };

    script.src   = url + "?callback=" + cbName + "&t=" + Date.now();
    script.onerror = () => { cleanup(); reject(new Error("Could not reach Google Sheets — check URL")); };
    document.head.appendChild(script);
  });
}

  const resolvedUrl = HARDCODED_SCRIPT_URL.trim() || lsGet(KEY_SCRIPT,"");
  const [scriptUrl, setScript]  = useState(resolvedUrl);
  const [gpsReady, setGpsReady] = useState(false);   // true once permission granted
  const [gpsWarn,  setGpsWarn]  = useState("");       // shown if denied

  // ── Trigger GPS permission popup the moment the app loads ──────────────────
  useEffect(() => {
    if (!navigator.geolocation) {
      setGpsWarn("⚠️ GPS is not supported on this device.");
      return;
    }
    // A silent one-shot request just to trigger the browser permission dialog.
    // We don't use this position — it's only to get the user to click Allow.
    navigator.geolocation.getCurrentPosition(
      () => { setGpsReady(true); setGpsWarn(""); },
      (err) => {
        if (err.code === 1) {
          // PERMISSION_DENIED
          setGpsWarn("⚠️ Location access was denied. Please tap the 🔒 icon in the address bar, allow Location, then refresh the page.");
        } else {
          // Timeout or unavailable — not a denial, GPS will work when asked
          setGpsReady(true);
        }
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
    );
  }, []);

  const doLogin = () => {
    if(pw===ADMIN_PW){setUnlocked(true);setPwErr(false);}
    else{setPwErr(true);setTimeout(()=>setPwErr(false),2000);}
  };

  return (
    <div style={S.root}>
      <div style={S.header}>
        <svg width="36" height="36" viewBox="0 0 40 40" style={{flexShrink:0}}>
          <circle cx="20" cy="20" r="19" stroke="#c9a84c" strokeWidth="1.8" fill="none"/>
          <path d="M20 8L23 16L32 16L25 21L28 30L20 25L12 30L15 21L8 16L17 16Z" fill="#c9a84c"/>
        </svg>
        <div style={{flex:1}}>
          <div style={S.hTitle}>District Vehari — Local Government</div>
          <div style={S.hSub}>Secretary UC Attendance · Geo-Verified · 105 UCs</div>
        </div>
        <div style={{...S.statusDot, background:scriptUrl?"#4caf50":"#f39c12"}} title={scriptUrl?"Sheets Connected":"Local only"}/>
      </div>

      <div style={S.tabBar}>
        {[["staff","📋 Mark Attendance"],["admin","🛡️ Admin Panel"]].map(([id,lb])=>(
          <button key={id} style={{...S.tabBtn,...(tab===id?S.tabOn:{})}} onClick={()=>setTab(id)}>{lb}</button>
        ))}
      </div>

      {/* GPS denied warning — shown across both tabs */}
      {gpsWarn && (
        <div style={S.gpsBanner}>{gpsWarn}</div>
      )}

      <div style={S.main}>
        {tab==="staff" && <StaffForm ucList={ucList} scriptUrl={scriptUrl} gpsReady={gpsReady}/>}
        {tab==="admin" && (
          unlocked
            ? <AdminPanel ucList={ucList} setUcList={setUcList} scriptUrl={scriptUrl} setScript={setScript}/>
            : <AdminLogin value={pw} onChange={setPw} onLogin={doLogin} error={pwErr}/>
        )}
      </div>
      <div style={S.footer}>District Local Government · Vehari © 2026 · Geo-Fenced 500m</div>
    </div>
  );
}

  const [errs,   setErrs]     = useState({});
  const [busy,   setBusy]     = useState(false);
  const [status, setStatus]   = useState(null); // null|"saved"|"offline"

  const selectedUC = ucList.find(u => u.no === parseInt(ucNum));

  // ── Fill by UC number ──────────────────────────────────────────────────────
  const fillByNo = val => {
    setUcNum(val);
    setLoc(null); setDist(null); setLocState("idle"); setLocMsg("");
    const n=parseInt(val);
    const m=!isNaN(n)&&ucList.find(u=>u.no===n);
    if(m){setUcName(m.name);setTehsil(m.tehsil);}
    else{setUcName("");setTehsil("");}
    setSugg([]); setShowSugg(false);
  };

  const fillByName = val => {
    setUcName(val);
    setLoc(null); setDist(null); setLocState("idle"); setLocMsg("");
    if(val.length>=2){
      setSugg(ucList.filter(u=>u.name.toLowerCase().includes(val.toLowerCase())||String(u.no).includes(val)).slice(0,7));
      setShowSugg(true);
    }else{setSugg([]);setShowSugg(false);}
  };

  const pickSugg = uc => {
    setUcNum(String(uc.no)); setUcName(uc.name); setTehsil(uc.tehsil);
    setSugg([]); setShowSugg(false);
    setLoc(null); setDist(null); setLocState("idle"); setLocMsg("");
  };

  // ── GEOFENCE LOCATION CHECK ────────────────────────────────────────────────
  const captureLocation = () => {
    if(!selectedUC){ setLocMsg("⚠️ Please select your UC number first."); return; }
    if(!navigator.geolocation){ setLocMsg("GPS not supported on this device."); return; }

    setLocState("fetching"); setLocMsg(""); setLoc(null); setDist(null);

    navigator.geolocation.getCurrentPosition(
      pos => {
        const myLat = pos.coords.latitude;
        const myLng = pos.coords.longitude;
        const acc   = Math.round(pos.coords.accuracy);
        const dist  = Math.round(distanceM(myLat, myLng, selectedUC.lat, selectedUC.lng));

        setLoc({ lat:myLat, lng:myLng, acc });
        setDist(dist);

        if(dist <= GEOFENCE_M){
          setLocState("inside");
          setLocMsg(`✅ Verified! You are ${dist}m from your UC office.`);
        } else {
          setLocState("outside");
          setLocMsg(`❌ You are ${dist}m away from ${selectedUC.name} office. Must be within ${GEOFENCE_M}m.`);
        }
      },
      err => {
        setLocState("error");
        setLocMsg("Cannot get GPS — please allow location permission when browser asks.");
      },
      { enableHighAccuracy:true, timeout:15000 }
    );
  };

  const handlePhoto = async e => {
    const f=e.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=async ev=>{const c=await compressPhoto(ev.target.result);setPhoto(c);};
    reader.readAsDataURL(f);
  };

  const validate = () => {
    const e={};
    const n=parseInt(ucNum);
    if(!ucNum.trim()||isNaN(n)||n<1||n>105) e.ucNum="Valid UC Number (1–105) required";
    if(!ucName.trim()) e.ucName="UC Name is required";
    if(!sec.trim())    e.sec="Secretary name is required";
    if(!photo)         e.photo="Photo is mandatory";
    if(locState!=="inside") e.loc="Location must be verified within 500m of UC office";
    setErrs(e); return Object.keys(e).length===0;
  };

  const submit = async () => {
    if(!validate()) return;
    setBusy(true);
    const rec = {
      id:Date.now(), timestamp:new Date().toISOString(),
      ucNumber:ucNum.trim(), ucName:ucName.trim(), tehsil:selectedUC?.tehsil||tehsil,
      secretaryName:sec.trim(),
      lat:loc.lat, lng:loc.lng, locationAccuracy:loc.acc,
      distanceFromOffice:distance,
      photo
    };
    const existing=lsGet(KEY_REC,[]);
    lsSet(KEY_REC,[...existing,rec]);

    let synced = false;
    if (scriptUrl) {
      try {
        // Send record WITHOUT the photo to Google Sheets (photo is local only)
        const cloudRec = { ...rec, photo: null };
        const res = await postToSheet(scriptUrl, cloudRec);
        synced = (res && res.success !== false);
      } catch(e) {
        console.error("Sync error:", e);
      }
    }

    if (!synced && scriptUrl) {
      // Queue for retry later
      const q = lsGet(KEY_QUEUE, []);
      lsSet(KEY_QUEUE, [...q, rec.id]);
    }

    setBusy(false);
    setStatus(synced ? "saved" : (scriptUrl ? "offline" : "local"));
    setTimeout(()=>{
      setStatus(null);
      setUcNum("");setUcName("");setTehsil("");setSec("");setPhoto(null);
      setLoc(null);setDist(null);setLocState("idle");setLocMsg("");setErrs({});
    },3200);
  };

  // ── RESULT SCREENS ─────────────────────────────────────────────────────────
  if(status==="saved") return(
    <div style={S.successBox}>
      <div style={{fontSize:64}}>✅</div>
      <div style={S.sucTitle}>Attendance Submitted!</div>
      <div style={S.sucSub}>Saved to Google Sheets successfully.</div>
    </div>
  );
  if(status==="offline") return(
    <div style={S.successBox}>
      <div style={{fontSize:64}}>📡</div>
      <div style={{...S.sucTitle,color:"#e67e22"}}>Saved — Sync Pending</div>
      <div style={S.sucSub}>Attendance saved on device. Could not reach Google Sheets right now. It will sync automatically — or ask admin to sync from Admin Panel.</div>
    </div>
  );

  if(status==="local") return(
    <div style={S.successBox}>
      <div style={{fontSize:64}}>💾</div>
      <div style={{...S.sucTitle,color:"#888"}}>Saved Locally</div>
      <div style={S.sucSub}>Google Sheets is not connected yet. Record saved on this device only. Contact your admin.</div>
    </div>
  );

  // ── GEOFENCE STATUS BOX ────────────────────────────────────────────────────
  const geoBox = () => {
    if(locState==="idle") return null;
    if(locState==="fetching") return(
      <div style={{...S.geoBox, borderColor:"#f39c12", background:"#fffbf0"}}>
        <span className="pulsing">📡</span> Getting your GPS location…
      </div>
    );
    if(locState==="inside") return(
      <div style={{...S.geoBox, borderColor:"#27ae60", background:"#f0faf4"}}>
        <div style={{color:"#1a7a3a",fontWeight:700,fontSize:14}}>✅ Location Verified</div>
        <div style={{fontSize:12,color:"#2a6a3a",marginTop:4}}>
          📌 {loc.lat.toFixed(5)}, {loc.lng.toFixed(5)}<br/>
          📏 {distance}m from office · GPS accuracy ±{loc.acc}m
        </div>
      </div>
    );
    if(locState==="outside") return(
      <div style={{...S.geoBox, borderColor:"#e74c3c", background:"#fff8f8"}}>
        <div style={{color:"#c0392b",fontWeight:700,fontSize:14}}>🚫 Outside Geofence</div>
        <div style={{fontSize:12,color:"#922b21",marginTop:4}}>
          You are <strong>{distance}m</strong> from {selectedUC?.name} office.<br/>
          You must be within <strong>500m</strong> to mark attendance.<br/>
          Please go to your UC office and try again.
        </div>
        <div style={{fontSize:11,color:"#888",marginTop:4}}>
          📌 {loc.lat.toFixed(5)}, {loc.lng.toFixed(5)} · ±{loc.acc}m accuracy
        </div>
      </div>
    );
    if(locState==="error") return(
      <div style={{...S.geoBox, borderColor:"#e74c3c", background:"#fff8f8"}}>
        <div style={{color:"#c0392b",fontWeight:700}}>❌ GPS Error</div>
        <div style={{fontSize:12,color:"#922b21",marginTop:4}}>Please allow location access in your browser settings and try again.</div>
      </div>
    );
  };

  return(
    <div style={S.card}>
      <div style={S.cardTitle}>Secretary UC — Daily Attendance</div>
      <div style={S.cardSub}>All fields mandatory · Location verified within 500m of UC office</div>

      {/* UC Number */}
      <div style={S.fld}>
        <label style={S.lbl}>UC Number (1–105) *</label>
        <input style={{...S.inp,...(errs.ucNum?S.inpErr:{})}} type="number" min="1" max="105" placeholder="e.g. 55" value={ucNum} onChange={e=>fillByNo(e.target.value)}/>
        {errs.ucNum&&<div style={S.err}>{errs.ucNum}</div>}
      </div>

      {/* UC Name */}
      <div style={S.fld}>
        <label style={S.lbl}>UC Name *</label>
        <div style={{position:"relative"}}>
          <input style={{...S.inp,...(errs.ucName?S.inpErr:{})}} type="text" placeholder="Auto-fills, or type to search" value={ucName} onChange={e=>fillByName(e.target.value)} onBlur={()=>setTimeout(()=>setShowSugg(false),250)}/>
          {showSugg&&sugg.length>0&&(
            <div style={S.dropdown}>
              {sugg.map(uc=>(
                <div key={uc.no} style={S.ddItem} onMouseDown={()=>pickSugg(uc)}>
                  <span style={S.ddBadge}>UC {uc.no}</span>
                  <span style={{flex:1}}>{uc.name}</span>
                  <span style={S.ddTehsil}>{uc.tehsil}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        {tehsil&&<div style={S.tehsilChip}>📍 Tehsil: <strong>{tehsil}</strong></div>}
        {errs.ucName&&<div style={S.err}>{errs.ucName}</div>}
      </div>

      {/* Secretary */}
      <div style={S.fld}>
        <label style={S.lbl}>Secretary UC Name *</label>
        <input style={{...S.inp,...(errs.sec?S.inpErr:{})}} type="text" placeholder="Full name of Secretary UC" value={sec} onChange={e=>setSec(e.target.value)}/>
        {errs.sec&&<div style={S.err}>{errs.sec}</div>}
      </div>

      {/* GPS + Geofence */}
      <div style={S.fld}>
        <label style={S.lbl}>GPS Verification (500m radius) *</label>

        {/* Show office location if UC selected */}
        {selectedUC&&(
          <div style={S.officeInfo}>
            🏢 <strong>{selectedUC.name}</strong> office coordinates loaded
            <a href={`https://maps.google.com/?q=${selectedUC.lat},${selectedUC.lng}`} target="_blank" rel="noreferrer" style={{marginLeft:8,color:"#2980b9",fontSize:11}}>View on Map ↗</a>
          </div>
        )}

        {/* If location was denied at page load, show instructions */}
        {!gpsReady && locState==="idle" && (
          <div style={{...S.geoBox, borderColor:"#f39c12", background:"#fffbf0", marginTop:8}}>
            <div style={{fontWeight:700,color:"#e67e22"}}>📍 Location Permission Needed</div>
            <div style={{fontSize:12,color:"#7a5a00",marginTop:4}}>
              Tap the 🔒 lock icon in Chrome's address bar → tap <strong>Location</strong> → select <strong>Allow</strong> → then refresh the page.
            </div>
          </div>
        )}

        <button
          style={{
            ...S.actionBtn,
            ...(locState==="inside"?S.actionOk:{}),
            ...(locState==="outside"||locState==="error"?S.actionErr:{}),
            ...(locState==="fetching"?S.actionBusy:{}),
            marginTop:8
          }}
          onClick={captureLocation}
          disabled={locState==="fetching"}
        >
          {locState==="idle"    && "📍 Verify My Location"}
          {locState==="fetching"&& <span className="pulsing">📡 Detecting GPS…</span>}
          {locState==="inside"  && "📍 Location Verified ✓"}
          {locState==="outside" && "🚫 Outside Range — Try Again"}
          {locState==="error"   && "❌ GPS Error — Try Again"}
        </button>

        {geoBox()}
        {errs.loc&&locState!=="inside"&&<div style={S.err}>{errs.loc}</div>}
      </div>

      {/* Photo */}
      <div style={S.fld}>
        <label style={S.lbl}>Selfie / Photo *</label>
        <label style={{...S.actionBtn,...(photo?S.actionOk:{}),cursor:"pointer"}}>
          <input type="file" accept="image/*" capture="user" style={{display:"none"}} onChange={handlePhoto}/>
          {photo?"📸 Photo Captured ✓":"📸 Take Selfie / Upload Photo"}
        </label>
        {photo&&<>
          <img src={photo} alt="Preview" style={S.photoImg}/>
          <button style={S.retakeBtn} onClick={()=>setPhoto(null)}>🔄 Retake</button>
        </>}
        {errs.photo&&!photo&&<div style={S.err}>{errs.photo}</div>}
      </div>

      <button style={{...S.submitBtn,opacity:busy?.7:1}} onClick={submit} disabled={busy}>
        {busy?"⏳ Submitting…":"✅ Submit Attendance"}
      </button>
    </div>
  );
}

//  ADMIN LOGIN
// ═══════════════════════════════════════════════════════════════════════════════
function AdminLogin({value,onChange,onLogin,error}){
  return(
    <div style={{...S.card,textAlign:"center",paddingTop:32}}>
      <div style={{fontSize:52,marginBottom:8}}>🛡️</div>
      <div style={S.cardTitle}>Admin Access</div>
      <div style={S.cardSub}>Authorised officers only</div>
      <input style={{...S.inp,textAlign:"center",letterSpacing:5,marginTop:16,...(error?S.inpErr:{})}} type="password" placeholder="Enter password" value={value} onChange={e=>onChange(e.target.value)} onKeyDown={e=>e.key==="Enter"&&onLogin()}/>
      {error&&<div style={{...S.err,textAlign:"center",marginTop:6}}>❌ Incorrect password</div>}
      <button style={{...S.submitBtn,marginTop:16}} onClick={onLogin}>🔓 Login</button>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
//  ADMIN PANEL
// ═══════════════════════════════════════════════════════════════════════════════
function AdminPanel({ucList,setUcList,scriptUrl,setScript}){
  const [sub,setSub]       = useState("records");
  const [records,setRecs]  = useState([]);
  const [loading,setLoading]= useState(false);
  const [fUC,setFUC]       = useState("");
  const [fTH,setFTH]       = useState("");
  const [fFrom,setFFrom]   = useState("");
  const [fTo,setFTo]       = useState("");
  const [bigPhoto,setBig]  = useState(null);
  const [qCount,setQC]     = useState(()=>lsGet(KEY_QUEUE,[]).length);
  const [syncing,setSyncing]= useState(false);
  const [syncMsg,setSyncMsg]= useState("");
  const todayStr = new Date().toISOString().slice(0,10);

  const [fetchErr, setFetchErr] = useState("");

  const loadRecs = async () => {
    setLoading(true); setFetchErr("");
    if (scriptUrl) {
      try {
        const r = await fetchFromSheet(scriptUrl);
        setRecs(r);
        setLoading(false);
        return;
      } catch(e) {
        setFetchErr("⚠️ Could not fetch from Google Sheets: " + e.message + " — Showing local records only.");
      }
    } else {
      setFetchErr("⚠️ Google Sheets not connected. Showing this device's local records only. Other secretaries' records will NOT appear until you connect Google Sheets.");
    }
    setRecs(lsGet(KEY_REC, []));
    setLoading(false);
  };

  useEffect(() => { if(sub==="records") loadRecs(); }, [sub, scriptUrl]);

  const norm = r=>({
    id:        r["ID"]||r.id,
    timestamp: r["Timestamp"]||r.timestamp||"",
    ucNumber:  String(r["UC No"]||r.ucNumber||""),
    ucName:    r["UC Name"]||r.ucName||"",
    tehsil:    r["Tehsil"]||r.tehsil||"",
    secretaryName: r["Secretary Name"]||r.secretaryName||"",
    lat:       r["Latitude"]||r.lat,
    lng:       r["Longitude"]||r.lng,
    acc:       r["Accuracy (m)"]||r.locationAccuracy,
    dist:      r["Distance from Office (m)"]||r.distanceFromOffice||"",
    mapsLink:  r["Google Maps Link"]||(r.lat?`https://maps.google.com/?q=${r.lat},${r.lng}`:""),
    photoLink: r["Photo (Drive Link)"]||null,
    photo:     r.photo||null,
  });

  const filtered = records.filter(r=>{
    const n=norm(r);
    return (!fUC||n.ucNumber===fUC)&&(!fTH||(n.tehsil)===fTH)&&
           (!fFrom||isoDate(n.timestamp)>=fFrom)&&(!fTo||isoDate(n.timestamp)<=fTo);
  });

  const allUCNos   = [...new Set(records.map(r=>String(norm(r).ucNumber)))].sort((a,b)=>+a-+b);
  const allTehsils = [...new Set(records.map(r=>norm(r).tehsil).filter(Boolean))].sort();
  const todayCount = records.filter(r=>isoDate(norm(r).timestamp)===todayStr).length;

  const syncQueue = async () => {
    if(!scriptUrl) return;
    const queue=lsGet(KEY_QUEUE,[]); if(!queue.length){setSyncMsg("✅ Nothing pending.");return;}
    setSyncing(true);
    const allLocal=lsGet(KEY_REC,[]);
    let ok=0; const rem=[];
    for(const id of queue){
      const rec=allLocal.find(r=>r.id===id); if(!rec){continue;}
      try{ const res=await postToSheet(scriptUrl,rec); if(res.success)ok++; else rem.push(id); }
      catch(_){rem.push(id);}
    }
    lsSet(KEY_QUEUE,rem); setQC(rem.length);
    setSyncing(false); setSyncMsg(`✅ Synced ${ok}. ${rem.length} still pending.`);
    loadRecs();
  };

  const exportExcel = () => {
    const wb=XLSX.utils.book_new();
    const normed=filtered.map(norm);

    // Sheet 1 – Detail
    const det=normed.map((r,i)=>({
      "Sr#":i+1,"Date":isoDate(r.timestamp),
      "Time":r.timestamp?new Date(r.timestamp).toLocaleTimeString("en-PK",{hour:"2-digit",minute:"2-digit",hour12:true}):"",
      "UC No":r.ucNumber,"UC Name":r.ucName,"Tehsil":r.tehsil,
      "Secretary Name":r.secretaryName,
      "Distance from Office (m)":r.dist,
      "Latitude":r.lat,"Longitude":r.lng,"Accuracy (m)":r.acc,
      "Google Maps":r.mapsLink,"Photo Link":r.photoLink||"",
    }));
    const ws1=XLSX.utils.json_to_sheet(det.length?det:[{Note:"No records"}]);
    ws1["!cols"]=[{wch:5},{wch:13},{wch:10},{wch:7},{wch:26},{wch:14},{wch:26},{wch:22},{wch:13},{wch:13},{wch:13},{wch:44},{wch:44}];
    XLSX.utils.book_append_sheet(wb,ws1,"Attendance Detail");

    // Sheet 2 – UC-wise (all 105)
    const ucMap={};
    normed.forEach(r=>{ if(!ucMap[r.ucNumber])ucMap[r.ucNumber]={ucNo:r.ucNumber,ucName:r.ucName,tehsil:r.tehsil,count:0,dates:new Set()}; ucMap[r.ucNumber].count++;ucMap[r.ucNumber].dates.add(isoDate(r.timestamp)); });
    ucList.forEach(u=>{ const k=String(u.no); if(!ucMap[k])ucMap[k]={ucNo:k,ucName:u.name,tehsil:u.tehsil,count:0,dates:new Set()}; });
    const ws2=XLSX.utils.json_to_sheet(Object.values(ucMap).sort((a,b)=>+a.ucNo-+b.ucNo).map((u,i)=>({
      "Sr#":i+1,"UC No":u.ucNo,"UC Name":u.ucName,"Tehsil":u.tehsil,
      "Total Attendance":u.count,"Unique Days":u.dates.size,
      "Status":u.count>0?"Present":"Absent",
      "Dates Present":[...u.dates].sort().join(", "),
    })));
    ws2["!cols"]=[{wch:5},{wch:7},{wch:26},{wch:14},{wch:18},{wch:12},{wch:10},{wch:60}];
    XLSX.utils.book_append_sheet(wb,ws2,"UC-Wise Summary");

    // Sheet 3 – Date matrix
    const dateMap={};
    normed.forEach(r=>{ const d=isoDate(r.timestamp); if(!dateMap[d])dateMap[d]={}; dateMap[d][r.ucNumber]=true; });
    const allDates=Object.keys(dateMap).sort();
    if(allDates.length){
      const rows=allDates.map(d=>{ const row={"Date":d,"Total Present":Object.keys(dateMap[d]).length}; ucList.forEach(u=>{row["UC"+u.no]=dateMap[d][String(u.no)]?"P":""}); return row; });
      const ws3=XLSX.utils.json_to_sheet(rows);
      ws3["!cols"]=[{wch:13},{wch:14},...ucList.map(()=>({wch:5}))];
      XLSX.utils.book_append_sheet(wb,ws3,"Date-Wise Matrix");
    }

    // Sheet 4 – Tehsil
    const tMap={};
    normed.forEach(r=>{ const t=r.tehsil||"Unknown"; if(!tMap[t])tMap[t]={count:0,ucs:new Set()}; tMap[t].count++;tMap[t].ucs.add(r.ucNumber); });
    if(Object.keys(tMap).length){
      const ws4=XLSX.utils.json_to_sheet(Object.entries(tMap).map(([t,v],i)=>({"Sr#":i+1,"Tehsil":t,"Total Records":v.count,"Active UCs":v.ucs.size})));
      ws4["!cols"]=[{wch:5},{wch:16},{wch:16},{wch:12}];
      XLSX.utils.book_append_sheet(wb,ws4,"Tehsil-Wise Summary");
    }
    XLSX.writeFile(wb,`Vehari_UC_Attendance_${todayStr}.xlsx`);
  };

  return(
    <div>
      <div style={S.subBar}>
        {[["records","📊 Records"],["settings","⚙️ Settings"],["ucmaster","📋 UC List"]].map(([id,lb])=>(
          <button key={id} style={{...S.subBtn,...(sub===id?S.subOn:{})}} onClick={()=>setSub(id)}>{lb}</button>
        ))}
      </div>

      {sub==="records"&&<>
        {/* Connection status banner */}
        {fetchErr && (
          <div style={{background:"#fff3cd",border:"1px solid #f0c040",borderRadius:9,padding:"11px 14px",marginBottom:12,fontSize:12,color:"#7a4f00",lineHeight:1.6}}>
            {fetchErr}
            <div style={{marginTop:6}}>
              <strong>To fix:</strong> Go to ⚙️ Settings tab → paste your Google Script URL → Save → come back here and tap 🔄 Refresh.
            </div>
          </div>
        )}
        <div style={S.statsRow}>
          {[[records.length,"📋","Total"],[todayCount,"📅","Today"],[new Set(records.map(r=>norm(r).ucNumber)).size,"🏘️","UCs"],[filtered.length,"🔍","Filtered"]].map(([n,ic,lb])=>(
            <div key={lb} style={S.statCard}><div style={{fontSize:18}}>{ic}</div><div style={S.statN}>{n}</div><div style={S.statL}>{lb}</div></div>
          ))}
        </div>

        {qCount>0&&(
          <div style={S.syncBanner}>
            📤 {qCount} record(s) pending sync.
            <button style={S.syncBtn} onClick={syncQueue} disabled={syncing}>{syncing?"Syncing…":"Sync Now"}</button>
          </div>
        )}
        {syncMsg&&<div style={S.syncMsg}>{syncMsg}</div>}

        <div style={S.card}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={S.cardTitle}>Filter & Export</div>
            <button style={S.refreshBtn} onClick={loadRecs} disabled={loading}>{loading?"…":"🔄 Refresh"}</button>
          </div>
          <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:10}}>
            {[
              ["UC",<select style={S.inp} value={fUC} onChange={e=>setFUC(e.target.value)}><option value="">All UCs</option>{allUCNos.map(n=><option key={n} value={n}>UC {n}</option>)}</select>],
              ["Tehsil",<select style={S.inp} value={fTH} onChange={e=>setFTH(e.target.value)}><option value="">All</option>{allTehsils.map(t=><option key={t}>{t}</option>)}</select>],
              ["From",<input style={S.inp} type="date" value={fFrom} onChange={e=>setFFrom(e.target.value)}/>],
              ["To",<input style={S.inp} type="date" value={fTo} onChange={e=>setFTo(e.target.value)}/>],
            ].map(([lb,ctrl])=>(
              <div key={lb} style={{flex:1,minWidth:105}}><label style={{...S.lbl,marginBottom:3}}>{lb}</label>{ctrl}</div>
            ))}
          </div>
          <button style={S.exportBtn} onClick={exportExcel}>📊 Export Excel — {filtered.length} records · 4 sheets</button>
        </div>

        <div style={S.card}>
          <div style={S.cardTitle}>Attendance Records</div>
          {loading?<div style={S.empty}>Loading…</div>
          :filtered.length===0?<div style={S.empty}><div style={{fontSize:36}}>📭</div><div>No records</div></div>
          :<div style={{display:"flex",flexDirection:"column",gap:9}}>
            {[...filtered].reverse().map((r,i)=>{
              const n=norm(r);
              return(
                <div key={n.id||i} style={S.recCard}>
                  <div style={S.recTop}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={S.ucBadge}>UC {n.ucNumber}</span>
                      <span style={S.recUCN}>{n.ucName}</span>
                      {n.tehsil&&<span style={S.tBadge}>{n.tehsil}</span>}
                    </div>
                    <span style={S.recTime}>{fmtDT(n.timestamp)}</span>
                  </div>
                  <div style={S.recBody}>
                    <span>👤 {n.secretaryName}</span>
                    {n.dist&&<span style={{fontSize:11,color:"#27ae60",fontWeight:600}}>📏 {n.dist}m</span>}
                    <a href={n.mapsLink} target="_blank" rel="noreferrer" style={S.mapLink}>📍 Map ↗</a>
                    {n.photoLink&&<a href={n.photoLink} target="_blank" rel="noreferrer" style={S.mapLink}>📸 ↗</a>}
                    {n.photo&&!n.photoLink&&<button style={S.viewBtn} onClick={()=>setBig(n.photo)}>📸</button>}
                  </div>
                </div>
              );
            })}
          </div>}
        </div>
      </>}

      {sub==="settings"&&<SettingsPanel scriptUrl={scriptUrl} setScript={setScript}/>}
      {sub==="ucmaster"&&<UCMaster ucList={ucList} setUcList={setUcList}/>}

      {bigPhoto&&(
        <div style={S.modal} onClick={()=>setBig(null)}>
          <div style={S.modalBox} onClick={e=>e.stopPropagation()}>
            <img src={bigPhoto} alt="Staff" style={{width:"100%",display:"block"}}/>
            <button style={S.modalClose} onClick={()=>setBig(null)}>✕ Close</button>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
//  SETTINGS
// ═══════════════════════════════════════════════════════════════════════════════
function SettingsPanel({scriptUrl,setScript}){
  const [url,setUrl]=useState(scriptUrl);
  const [testing,setTesting]=useState(false);
  const [msg,setMsg]=useState("");
  const save=()=>{ const t=url.trim(); lsSet(KEY_SCRIPT,t); setScript(t); setMsg("✅ URL saved!"); setTimeout(()=>setMsg(""),2000); };
  const test=async()=>{
    if(!url.trim()){setMsg("❌ Paste a URL first.");return;}
    setTesting(true);setMsg("Testing…");
    try{ const r=await fetchFromSheet(url.trim()); setMsg(`✅ Connected! ${r.length} records in Sheets.`); }
    catch(_){ setMsg("❌ Failed. Check URL and redeploy as 'Anyone'."); }
    setTesting(false);
  };
  return(
    <div style={S.card}>
      <div style={S.cardTitle}>⚙️ Google Sheets Connection</div>
      <div style={{...S.cardSub,background:"#f0f8ff",border:"1px solid #b0d0f0",borderRadius:8,padding:"12px",marginBottom:14,color:"#1a3a6a"}}>
        <strong>Setup steps:</strong><br/>
        1. Go to sheets.google.com → New sheet<br/>
        2. Extensions → Apps Script → paste Code.gs → Save<br/>
        3. Deploy → New deployment → Web app<br/>
        4. Execute as: Me · Access: Anyone → Deploy<br/>
        5. Copy the URL and paste below
      </div>
      <label style={S.lbl}>Apps Script Web App URL</label>
      <input style={{...S.inp,fontSize:12}} type="url" placeholder="https://script.google.com/macros/s/XXXX/exec" value={url} onChange={e=>setUrl(e.target.value)}/>
      {msg&&<div style={{marginTop:8,fontSize:13,fontWeight:600,color:msg.startsWith("✅")?"#1a7a3a":"#c0392b"}}>{msg}</div>}
      <div style={{display:"flex",gap:10,marginTop:12}}>
        <button style={{...S.submitBtn,flex:1,marginTop:0,fontSize:13}} onClick={save}>💾 Save</button>
        <button style={{...S.submitBtn,flex:1,marginTop:0,fontSize:13,background:"linear-gradient(135deg,#1a5276,#2980b9)"}} onClick={test} disabled={testing}>🔗 Test</button>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════
//  UC MASTER LIST EDITOR
// ═══════════════════════════════════════════════════════════════════════════════
function UCMaster({ucList,setUcList}){
  const [search,setSearch]=useState("");
  const filt=ucList.filter(u=>u.name.toLowerCase().includes(search.toLowerCase())||String(u.no).includes(search)||u.tehsil.toLowerCase().includes(search.toLowerCase()));
  return(
    <div style={S.card}>
      <div style={S.cardTitle}>📋 UC List — 105 UCs with Office Coordinates</div>
      <div style={{...S.cardSub,background:"#f0faf4",border:"1px solid #a8d8b8",borderRadius:8,padding:"8px 12px",color:"#1a5a2a",marginBottom:12}}>
        ✅ All 105 UC office coordinates loaded from your official file. Geofence is set at 500m.
      </div>
      <input style={{...S.inp,marginBottom:10}} placeholder="🔍 Search…" value={search} onChange={e=>setSearch(e.target.value)}/>
      <div style={{fontSize:12,color:"#888",marginBottom:8}}>Showing {filt.length} of 105</div>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {filt.map(uc=>(
          <div key={uc.no} style={{...S.ucRow,flexDirection:"column",alignItems:"flex-start",gap:3}}>
            <div style={{display:"flex",alignItems:"center",gap:8,width:"100%"}}>
              <span style={{...S.ucBadge,fontSize:11,flexShrink:0}}>UC {uc.no}</span>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:"#1a3a2a"}}>{uc.name}</div>
                <div style={{fontSize:11,color:"#888"}}>{uc.tehsil}</div>
              </div>
              <a href={`https://maps.google.com/?q=${uc.lat},${uc.lng}`} target="_blank" rel="noreferrer" style={{fontSize:11,color:"#2980b9",textDecoration:"none",flexShrink:0}}>📍 Map</a>
            </div>
            <div style={{fontSize:10,color:"#aaa",paddingLeft:2}}>
              Office: {uc.lat.toFixed(6)}, {uc.lng.toFixed(6)}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
